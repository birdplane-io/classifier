[project]
name = "classifier"
version = "0.1.0"
description = "Minimal FastAPI classifier service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "openai>=1.50.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
